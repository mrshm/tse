plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.tse.tools"
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.tse.tools"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"

        // پیش‌فرض فقط arm64 برای گوشی؛ برای شبیه‌ساز x86_64:
        //   gradle -Pabis=arm64-v8a,x86_64 assembleDebug
        ndk {
            abiFilters(*((findProperty("abis") ?: "arm64-v8a").toString().split(",") as List))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // کلید امضای نسخهٔ نصبی؛ رمزش در keystore.properties کنار پروژه است.
    signingConfigs {
        release {
            def cfgFile = rootProject.file("keystore.properties")
            if (cfgFile.exists()) {
                def cfg = new Properties()
                cfgFile.withInputStream { cfg.load(it) }
                storeFile rootProject.file(cfg.storeFile)
                storePassword cfg.storePassword
                keyAlias cfg.keyAlias
                keyPassword cfg.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        buildPython "/home/mrshm/toolchains/py313/python/bin/python3"
        pip {
            // Downloading from chaquo.com is very slow on this network, so the
            // wheels were fetched in advance and are installed from a local dir.
            options "--no-index", "--find-links=/home/mrshm/wheelhouse"
            install "numpy==1.26.2"
            install "pandas==2.1.3"
            install "jdatetime==6.1.1"
            install "certifi==2026.10.23"
        }
    }
}

// کد پایتون داخل APK از core/ و web/ کپی می شود تا همیشه با منبع یکی باشد.
tasks.register("syncPython", Exec) {
    workingDir rootProject.projectDir
    commandLine "bash", "tools/sync_src.sh"
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn "syncPython"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.fragment:fragment:1.8.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
}
